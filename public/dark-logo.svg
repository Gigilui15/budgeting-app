<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cash icon, dark theme</title>
  <desc id="desc">A luminous turquoise flowing banknote on a rounded navy tile.</desc>
  <defs>
    <linearGradient id="tileDark" x1="256" y1="48" x2="256" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27334f"/>
      <stop offset=".5" stop-color="#172138"/>
      <stop offset="1" stop-color="#0d1528"/>
    </linearGradient>
    <linearGradient id="rim" x1="256" y1="48" x2="256" y2="456" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8199d2" stop-opacity=".72"/>
      <stop offset=".3" stop-color="#35466e" stop-opacity=".2"/>
      <stop offset="1" stop-color="#050a16" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="rearDark" x1="130" y1="180" x2="390" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#314767"/>
      <stop offset=".5" stop-color="#52698c"/>
      <stop offset="1" stop-color="#8395bc"/>
    </linearGradient>
    <linearGradient id="noteDark" x1="132" y1="315" x2="390" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00f09d"/>
      <stop offset=".48" stop-color="#00d9ba"/>
      <stop offset="1" stop-color="#00a9c9"/>
    </linearGradient>
    <linearGradient id="edgeDark" x1="128" y1="240" x2="394" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00a9ca"/>
      <stop offset=".5" stop-color="#00c5c8"/>
      <stop offset="1" stop-color="#00f2ad"/>
    </linearGradient>
    <radialGradient id="sealDark">
      <stop stop-color="#00e5bc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#008daf" stop-opacity=".28"/>
    </radialGradient>
    <filter id="shadowDark" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#020617" flood-opacity=".5"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#00e5c0" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect x="56" y="48" width="400" height="408" rx="104" fill="url(#tileDark)" filter="url(#shadowDark)"/>
  <rect x="58" y="50" width="396" height="404" rx="102" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g filter="url(#glow)">
    <path d="M128 192c53-39 91-25 133-7 48 21 86 36 131 9v139c-48 29-87 12-132-8-43-20-81-35-132 2Z" fill="url(#rearDark)"/>
    <path d="M128 194c58 42 106 28 155 5 43-20 75-34 109-9v130c-42-24-78-12-121 8-48 22-91 39-143 4Z" fill="url(#noteDark)"/>
    <path d="M128 194c58 42 106 28 155 5 43-20 75-34 109-9v17c-39-24-75-10-117 9-48 22-94 37-147 2Z" fill="url(#edgeDark)"/>
    <path d="M128 316c52 35 95 18 143-4 43-20 79-32 121-8v16c-42-24-78-12-121 8-48 22-91 39-143 4Z" fill="#00aebc" opacity=".95"/>
    <circle cx="260" cy="260" r="43" fill="url(#sealDark)"/>
    <circle cx="260" cy="260" r="34" fill="#00cab6" opacity=".18"/>
  </g>
</svg>