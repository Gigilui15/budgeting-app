<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Cash icon</title>
  <desc id="desc">A turquoise flowing banknote on a rounded white tile.</desc>
  <defs>
    <linearGradient id="tile" x1="256" y1="56" x2="256" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".78" stop-color="#fbfbfc"/>
      <stop offset="1" stop-color="#e4e5e9"/>
    </linearGradient>
    <linearGradient id="rear" x1="130" y1="180" x2="390" y2="340" gradientUnits="userSpaceOnUse">
